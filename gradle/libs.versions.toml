[versions]
agp = "8.13.0"
kotlin = "2.1.20"
composeBom = "2025.10.01"
activityCompose = "1.10.1"
lifecycle = "2.8.7"
coreKtx = "1.16.0"
junit = "4.13.2"
serialization = "1.8.1"
coroutines = "1.10.2"
commonsCompress = "1.27.1"
xz = "1.10"
apksig = "8.13.0"
smali = "3.0.9"
zip4j = "2.11.5"
libsu = "6.0.0"
shizuku = "13.1.5"
commonsNet = "3.11.1"
jsch = "0.2.21"
bouncycastle = "1.79"
smbj = "0.13.0"
okhttp = "4.12.0"
nanohttpd = "2.3.1"
securityCrypto = "1.1.0-alpha06"
zxing = "3.5.3"
biometric = "1.1.0"
fragment = "1.8.5"
androidxTestExt = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
espresso = "3.6.1"
junrar = "8.1.2"
termuxTerminal = "v0.118.3"
media3 = "1.4.1"
glance = "1.1.1"
documentfile = "1.0.1"
exifinterface = "1.3.7"
work = "2.10.0"
ftpserver = "1.2.0"
sshd = "2.12.1"
jadx = "1.5.0"
desugar = "2.1.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
smali-dexlib2 = { module = "com.android.tools.smali:smali-dexlib2", version.ref = "smali" }
smali-baksmali = { module = "com.android.tools.smali:smali-baksmali", version.ref = "smali" }
smali-smali = { module = "com.android.tools.smali:smali", version.ref = "smali" }
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
commons-net = { module = "commons-net:commons-net", version.ref = "commonsNet" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
i2p-eddsa = { module = "net.i2p.crypto:eddsa", version = "0.3.0" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
smbj = { module = "com.hierynomus:smbj", version.ref = "smbj" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
junit = { module = "junit:junit", version.ref = "junit" }
# UnRAR license: extraction only; may not be used to develop a RAR-compatible archiver.
junrar = { module = "com.github.junrar:junrar", version.ref = "junrar" }
# Apache-2.0 (jackpal Android Terminal Emulator code, redistributed by Termux). termux-app itself is GPLv3 — we only use these two modules.
termux-terminal-emulator = { module = "com.github.termux.termux-app:terminal-emulator", version.ref = "termuxTerminal" }
termux-terminal-view = { module = "com.github.termux.termux-app:terminal-view", version.ref = "termuxTerminal" }
# Media3 / ExoPlayer — Apache-2.0. Video + audio playback, background MediaSessionService, notification controls.
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-rtsp = { module = "androidx.media3:media3-exoplayer-rtsp", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
# Glance — Apache-2.0. Home-screen app widgets built with a Compose-like API.
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
# androidx DocumentFile — Apache-2.0. SAF tree writes for "share to VictorFiles".
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
apache-ftpserver = { module = "org.apache.ftpserver:ftpserver-core", version.ref = "ftpserver" }
apache-sshd-core = { module = "org.apache.sshd:sshd-core", version.ref = "sshd" }
apache-sshd-sftp = { module = "org.apache.sshd:sshd-sftp", version.ref = "sshd" }
apache-sshd-common = { module = "org.apache.sshd:sshd-common", version.ref = "sshd" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

jadx-core = { module = "io.github.skylot:jadx-core", version.ref = "jadx" }
jadx-dex-input = { module = "io.github.skylot:jadx-dex-input", version.ref = "jadx" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
