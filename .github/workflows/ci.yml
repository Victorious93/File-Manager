name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual only: build, test and publish a debug-signed GitHub pre-release. See docs/RELEASING.md.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish as a pre-release (e.g. v0.1.0). Empty = just run CI."
        type: string
        default: ""

jobs:
  test-and-apk:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Do not use android-actions/setup-android's default package list: it
      # still installs the obsolete `tools` package, which sdkmanager no
      # longer ships. GitHub-hosted runners already have cmdline-tools and
      # ANDROID_HOME; install only current packages.
      - name: Accept licenses and install Android packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "ANDROID_HOME / ANDROID_SDK_ROOT is not set on this runner"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK"
            ls -la "$SDK" || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35"


      # Fail closed: CI must never silently fall back to the Android default
      # debug key. (The Gradle fallback stays for local / fork builds only.)
      - name: Require VictorFiles debug signing secrets
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for n in DEBUG_KEYSTORE_BASE64 DEBUG_KEYSTORE_PASSWORD DEBUG_KEY_ALIAS DEBUG_KEY_PASSWORD; do
            if [ -z "${!n:-}" ]; then missing+=("$n"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Debug signing secrets missing::Required secret(s) empty: ${missing[*]}. CI refuses to build a debug APK with the Android default key."
            exit 1
          fi
          echo "signing: all DEBUG_KEYSTORE_* secrets present"

      - name: Decode VictorFiles debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/fm-debug.jks"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$KS"
          chmod 600 "$KS"
          {
            echo "DEBUG_KEYSTORE_FILE=$KS"
            echo "DEBUG_KEYSTORE_PASSWORD=$DEBUG_KEYSTORE_PASSWORD"
            echo "DEBUG_KEY_ALIAS=$DEBUG_KEY_ALIAS"
            echo "DEBUG_KEY_PASSWORD=$DEBUG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signing: decoded VictorFiles debug keystore"
          # Do not print passwords, base64, or keytool -list output here.

      - name: Grant Gradle wrapper execute bit
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Show debug APK
        run: ls -lh app/build/outputs/apk/debug/*.apk


      - name: Verify debug APK signing fingerprint
        env:
          EXPECTED_SHA256: "8C:1F:E3:C9:E5:34:F2:71:05:C0:68:8F:45:28:D7:7E:47:11:AE:0A:79:DD:08:D1:E8:59:30:B9:E9:48:85:F2"
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n1)"
          echo "APK=$APK"
          # Print signer cert digests only (no private material).
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          actual="$(grep -i 'Signer #1 certificate SHA-256 digest' /tmp/apk-certs.txt | head -n1 | sed 's/.*digest:[[:space:]]*//' || true)"
          norm() { echo "$1" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'; }
          if [ -z "$actual" ]; then
            echo "::error title=Debug APK signature::apksigner printed no Signer #1 SHA-256 digest"
            exit 1
          fi
          if [ "$(norm "$actual")" != "$(norm "$EXPECTED_SHA256")" ]; then
            echo "::error title=Debug APK signed with wrong key::expected SHA-256 $EXPECTED_SHA256, got $actual"
            exit 1
          fi
          echo "signing: debug APK SHA-256 matches VictorFiles debug key"

      # Artifact upload is best-effort: this GitHub account has hit Actions
      # artifact storage quota, which we cannot free from the workflow. The
      # APK is still produced by assembleDebug above.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  # Separate check (not required): real app on an emulator. KVM is available on
  # ubuntu-latest GitHub-hosted runners; the Grok box's kernel KVM is not usable.
  emulator-smoke:
    name: Emulator smoke tests (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: "34"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Grant Gradle wrapper execute bit
        run: chmod +x gradlew

      # Built before boot so emulator time is spent testing. Default debug key here:
      # this job never needs the VictorFiles signing secrets.
      - name: Build debug + androidTest APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run smoke tests, monkey and logcat scan on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: bash .github/scripts/emulator-smoke.sh

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: emulator-smoke-logs
          path: |
            build/emulator-smoke/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 3

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Grant Gradle wrapper execute bit
        run: chmod +x gradlew

      - name: lintDebug (fails on errors)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Lint summary
        if: always()
        run: tail -n 1 app/build/reports/lint-results-debug.txt || true

  # Manual only (workflow_dispatch with release_tag). The only job with write access. It publishes
  # the exact debug APK that test-and-apk just built and tested; if that job fails or its artifact is
  # missing, nothing is published.
  publish-release:
    name: Publish pre-release
    needs: test-and-apk
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: dist

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]] || { echo "bad tag: $TAG" >&2; exit 1; }
          APK="$(ls dist/*.apk | head -n1)"
          cp "$APK" "dist/VictorFiles-${TAG}-debug.apk"
          rm "$APK"
          (cd dist && sha256sum *.apk | tee SHA256SUMS)
          cat > notes.md <<NOTES
          Debug-signed pre-release built by CI from commit ${GITHUB_SHA}. Sideload only.
          **Not device-tested**: CI ran unit tests, lint and an emulator smoke test, nothing else.

          Package \`ai.victorious.filemanager\` (debug build installs as \`ai.victorious.filemanager.debug\`).
          Pre-releases published earlier under \`ai.victorious.victorfiles\` are a different app id; uninstall them first.
          Verify the download with \`sha256sum -c SHA256SUMS\`.
          NOTES
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "VictorFiles ${TAG} (debug-signed pre-release)" \
            --notes-file notes.md --generate-notes
