name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-apk:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Do not use android-actions/setup-android's default package list: it
      # still installs the obsolete `tools` package, which sdkmanager no
      # longer ships. GitHub-hosted runners already have cmdline-tools and
      # ANDROID_HOME; install only current packages.
      - name: Accept licenses and install Android packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "ANDROID_HOME / ANDROID_SDK_ROOT is not set on this runner"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK"
            ls -la "$SDK" || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35"


      - name: Decode VictorFiles debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ] && [ -n "${DEBUG_KEYSTORE_PASSWORD:-}" ] \
            && [ -n "${DEBUG_KEY_ALIAS:-}" ] && [ -n "${DEBUG_KEY_PASSWORD:-}" ]; then
            KS="$RUNNER_TEMP/fm-debug.jks"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$KS"
            chmod 600 "$KS"
            {
              echo "DEBUG_KEYSTORE_FILE=$KS"
              echo "DEBUG_KEYSTORE_PASSWORD=$DEBUG_KEYSTORE_PASSWORD"
              echo "DEBUG_KEY_ALIAS=$DEBUG_KEY_ALIAS"
              echo "DEBUG_KEY_PASSWORD=$DEBUG_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signing: decoded VictorFiles debug keystore (secrets present)"
            # Do not print passwords, base64, or keytool -list output here.
          else
            echo "signing: DEBUG_KEYSTORE_* secrets missing; assembleDebug will use Android default debug key"
          fi

      - name: Grant Gradle wrapper execute bit
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Show debug APK
        run: ls -lh app/build/outputs/apk/debug/*.apk


      - name: Verify debug APK signing fingerprint
        if: env.DEBUG_KEYSTORE_FILE != ''
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n1)"
          echo "APK=$APK"
          # Print signer cert digests only (no private material).
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          if grep -qi 'Signer #1 certificate SHA-256 digest' /tmp/apk-certs.txt; then
            echo "signing: apksigner printed SHA-256 digest for debug APK"
          else
            echo "signing: unexpected apksigner output" >&2
            exit 1
          fi

      # Artifact upload is best-effort: this GitHub account has hit Actions
      # artifact storage quota, which we cannot free from the workflow. The
      # APK is still produced by assembleDebug above.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  # Separate check (not required): real app on an emulator. KVM is available on
  # ubuntu-latest GitHub-hosted runners; the Grok box's kernel KVM is not usable.
  emulator-smoke:
    name: Emulator smoke tests (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: "34"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Grant Gradle wrapper execute bit
        run: chmod +x gradlew

      # Built before boot so emulator time is spent testing. Default debug key here:
      # this job never needs the VictorFiles signing secrets.
      - name: Build debug + androidTest APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run smoke tests, monkey and logcat scan on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: bash .github/scripts/emulator-smoke.sh

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: emulator-smoke-logs
          path: |
            build/emulator-smoke/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 3

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Grant Gradle wrapper execute bit
        run: chmod +x gradlew

      - name: lintDebug (fails on errors)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Lint summary
        if: always()
        run: tail -n 1 app/build/reports/lint-results-debug.txt || true
